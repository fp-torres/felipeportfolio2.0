name: Deploy Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  web-deploy:
    name: Build, validar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Obter código
      uses: actions/checkout@v4
    
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Instalar dependências
      run: npm ci

    - name: Validar código
      run: npm run lint

    - name: Gerar build
      run: npm run build

    - name: Gerar configuração privada
      run: |
        cat << 'EOF' > ./dist/config.php
        <?php
        $SPOTIFY_CLIENT_ID = "${{ secrets.SPOTIFY_CLIENT_ID }}";
        $SPOTIFY_CLIENT_SECRET = "${{ secrets.SPOTIFY_CLIENT_SECRET }}";
        $SPOTIFY_REFRESH_TOKEN = "${{ secrets.SPOTIFY_REFRESH_TOKEN }}";
        $WAKATIME_TOKEN = "${{ secrets.WAKATIME_TOKEN }}";
        EOF
        chmod 600 ./dist/config.php

    - name: Publicar na Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/ 
        server-dir: ./
